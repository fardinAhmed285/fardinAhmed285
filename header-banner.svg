
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08090B"/>
      <stop offset="0.6" stop-color="#0D0D0F"/>
      <stop offset="1" stop-color="#170A0C"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F05252"/>
      <stop offset="1" stop-color="#8B1E2D"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" stroke="#FFFFFF" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
    <filter id="redGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="panelClip">
      <rect x="1" y="1" width="1198" height="348" rx="4"/>
    </clipPath>
  </defs>

  <g clip-path="url(#panelClip)">
    <rect width="1200" height="350" fill="url(#bg)"/>
    <rect width="1200" height="350" fill="url(#grid)"/>

    <!-- Terminal title bar -->
    <rect x="0" y="0" width="1200" height="42" fill="#101012"/>
    <path d="M0 42H1200" stroke="#353537"/>
    <circle cx="20" cy="21" r="4" fill="#F05252"/>
    <circle cx="36" cy="21" r="4" fill="#777777"/>
    <circle cx="52" cy="21" r="4" fill="#555555"/>

    <text x="75" y="25" fill="#858585" font-family="'Courier New', monospace" font-size="12">fardin@system: ~/profile</text>
    <text x="1175" y="25" fill="#F05252" font-family="'Courier New', monospace" font-size="11" text-anchor="end">SESSION_001 // LOCAL</text>

    <!-- Identity -->
    <text x="48" y="79" fill="#F05252" font-family="'Courier New', monospace" font-size="11" letter-spacing="2">[ IDENTITY / CLASSIFIED ]</text>

    <text x="44" y="132" fill="#E7E7E7" font-family="'Courier New', monospace" font-size="43" font-weight="bold" letter-spacing="-2">FARDIN AHMED</text>

    <rect x="48" y="151" width="3" height="25" fill="#F05252"/>
    <text x="63" y="169" fill="#F05252" font-family="'Courier New', monospace" font-size="19">AI ENGINEER IN PROGRESS</text>

    <text x="48" y="203" fill="#A0A0A0" font-family="'Courier New', monospace" font-size="12">MSc ARTIFICIAL INTELLIGENCE / BARCELONA</text>

    <path d="M48 220H560" stroke="#39393B" stroke-dasharray="4 5"/>

    <!-- Terminal command -->
    <text x="48" y="246" fill="#F05252" font-family="'Courier New', monospace" font-size="12">$ whoami</text>
    <text x="48" y="267" fill="#C9C9C9" font-family="'Courier New', monospace" font-size="12">building intelligent systems.</text>
    <text x="48" y="286" fill="#C9C9C9" font-family="'Courier New', monospace" font-size="12">studying agents, retrieval and autonomy.</text>

    <text x="48" y="322" fill="#656565" font-family="'Courier New', monospace" font-size="10">PYTHON // AI AGENTS // RAG // ML SYSTEMS</text>

    <!-- Right-side terminal panel -->
    <rect x="650" y="65" width="500" height="255" rx="3" fill="#09090A" stroke="#38383A"/>

    <rect x="650" y="65" width="500" height="34" fill="#151517"/>
    <path d="M650 99H1150" stroke="#38383A"/>
    <text x="668" y="86" fill="#A0A0A0" font-family="'Courier New', monospace" font-size="11">/var/log/ai_pipeline.log</text>
    <text x="1132" y="86" fill="#F05252" font-family="'Courier New', monospace" font-size="10" text-anchor="end">TAIL -F</text>

    <text x="670" y="123" fill="#666666" font-family="'Courier New', monospace" font-size="10">[ PROCESS MONITOR ]</text>

    <!-- Pipeline tracks -->
    <path d="M758 164H828M904 164H974M1050 164H1081" stroke="#38383A" stroke-width="2"/>
    <path d="M758 164H828M904 164H974M1050 164H1081" stroke="#8B1E2D" stroke-width="2" stroke-dasharray="6 12">
      <animate attributeName="stroke-dashoffset" values="36;0" dur="1.5s" repeatCount="indefinite"/>
    </path>

    <!-- Moving signal -->
    <circle r="4" fill="#F05252" filter="url(#redGlow)">
      <animateMotion dur="5s" repeatCount="indefinite" path="M758 164H828H904H974H1050H1081"/>
    </circle>

    <!-- Nodes -->
    <g font-family="'Courier New', monospace" text-anchor="middle">
      <rect x="675" y="143" width="83" height="42" rx="2" fill="#141416" stroke="#5B2028"/>
      <text x="716.5" y="159" fill="#F05252" font-size="9">01</text>
      <text x="716.5" y="173" fill="#D7D7D7" font-size="10">INGEST</text>

      <rect x="828" y="143" width="76" height="42" rx="2" fill="#141416" stroke="#5B2028"/>
      <text x="866" y="159" fill="#F05252" font-size="9">02</text>
      <text x="866" y="173" fill="#D7D7D7" font-size="10">REASON</text>

      <rect x="974" y="143" width="76" height="42" rx="2" fill="#141416" stroke="#5B2028"/>
      <text x="1012" y="159" fill="#F05252" font-size="9">03</text>
      <text x="1012" y="173" fill="#D7D7D7" font-size="10">BUILD</text>

      <rect x="1081" y="143" width="48" height="42" rx="2" fill="#141416" stroke="#5B2028"/>
      <text x="1105" y="159" fill="#F05252" font-size="9">04</text>
      <text x="1105" y="173" fill="#D7D7D7" font-size="9">TEST</text>
    </g>

    <!-- System log -->
    <path d="M668 202H1132" stroke="#29292B"/>
    <text x="670" y="221" fill="#777777" font-family="'Courier New', monospace" font-size="10">13:37:01</text>
    <text x="743" y="221" fill="#C9C9C9" font-family="'Courier New', monospace" font-size="10">agent.initialized()</text>
    <circle cx="1118" cy="217" r="3" fill="#F05252">
      <animate attributeName="opacity" values="1;.2;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>

    <text x="670" y="243" fill="#777777" font-family="'Courier New', monospace" font-size="10">13:37:02</text>
    <text x="743" y="243" fill="#C9C9C9" font-family="'Courier New', monospace" font-size="10">retrieval.ready()</text>
    <text x="1118" y="243" fill="#F05252" font-family="'Courier New', monospace" font-size="10" text-anchor="middle">OK</text>

    <text x="670" y="265" fill="#777777" font-family="'Courier New', monospace" font-size="10">13:37:03</text>
    <text x="743" y="265" fill="#C9C9C9" font-family="'Courier New', monospace" font-size="10">model.awaiting_input</text>

    <path d="M670 283H1132" stroke="#29292B"/>
    <text x="670" y="304" fill="#F05252" font-family="'Courier New', monospace" font-size="10">SYSTEM STATUS:</text>
    <text x="1132" y="304" fill="#D7D7D7" font-family="'Courier New', monospace" font-size="10" text-anchor="end">READY_</text>
    <rect x="1" y="347" width="1198" height="3" fill="url(#red)"/>
  </g>
</svg>
